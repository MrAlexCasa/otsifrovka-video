
<script>
(function () {
    const WORKER_URL =
        'https://dry-leaf-d8fd.alex-emeljanoq.workers.dev';

    // Мобильное меню
    const nav = document.querySelector('.main-nav');
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = nav ? nav.querySelectorAll('a') : [];
    const dropdownItem = document.querySelector(
        '.main-nav__item--has-dropdown'
    );
    const dropdownToggle = dropdownItem
        ? dropdownItem.querySelector(':scope > a')
        : null;

    function closeMenu() {
        if (!nav || !navToggle) return;

        nav.classList.remove('is-open');
        navToggle.setAttribute('aria-expanded', 'false');
        navToggle.setAttribute('aria-label', 'Открыть меню');

        if (dropdownItem) {
            dropdownItem.classList.remove('is-open');
        }

        if (dropdownToggle) {
            dropdownToggle.setAttribute('aria-expanded', 'false');
        }
    }

    if (nav && navToggle) {
        navToggle.addEventListener('click', function () {
            const isOpen = nav.classList.toggle('is-open');

            navToggle.setAttribute('aria-expanded', String(isOpen));
            navToggle.setAttribute(
                'aria-label',
                isOpen ? 'Закрыть меню' : 'Открыть меню'
            );

            if (!isOpen && dropdownItem) {
                dropdownItem.classList.remove('is-open');
                dropdownToggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Выпадающее меню форматов на телефонах
        if (dropdownToggle && dropdownItem) {
            dropdownToggle.addEventListener('click', function (event) {
                if (window.matchMedia('(max-width: 900px)').matches) {
                    event.preventDefault();

                    const isOpen =
                        dropdownItem.classList.toggle('is-open');

                    dropdownToggle.setAttribute(
                        'aria-expanded',
                        String(isOpen)
                    );
                } else {
                    event.preventDefault();

                    const isOpen =
                        dropdownItem.classList.toggle('is-open');

                    dropdownToggle.setAttribute(
                        'aria-expanded',
                        String(isOpen)
                    );
                }
            });
        }

        // Закрытие меню после перехода по ссылке
        navLinks.forEach(function (link) {
            if (link === dropdownToggle) return;

            link.addEventListener('click', closeMenu);
        });

        // Закрытие при нажатии Escape
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeMenu();
                navToggle.focus();
            }
        });

        // Закрытие при клике за пределами меню
        document.addEventListener('click', function (event) {
            if (
                nav.classList.contains('is-open') &&
                !nav.contains(event.target) &&
                !navToggle.contains(event.target)
            ) {
                closeMenu();
            }
        });

        // При переходе на большой экран сбрасываем мобильное меню
        window.addEventListener('resize', function () {
            if (window.innerWidth > 900) {
                closeMenu();
            }
        });
    }

    // Помощник сайта
    const toggleBtn = document.getElementById('ai-chat-toggle');
    const closeBtn = document.getElementById('ai-chat-close');
    const chatWindow = document.getElementById('ai-chat-window');
    const messages = document.getElementById('ai-chat-messages');
    const input = document.getElementById('ai-chat-input');
    const sendBtn = document.getElementById('ai-chat-send');

    function addMessage(kind, text) {
        const div = document.createElement('div');

        div.className = 'ai-msg ' + kind;
        div.textContent = text;

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;

        return div;
    }

    function openChat() {
        chatWindow.style.display = 'flex';
        toggleBtn.style.display = 'none';

        toggleBtn.setAttribute('aria-expanded', 'true');

        if (!messages.children.length) {
            addMessage(
                'bot',
                'Здравствуйте! Могу я вам помочь? Подскажу по форматам кассет, стоимости и порядку оцифровки.'
            );
        }

        input.focus();
    }

    function closeChat() {
        chatWindow.style.display = 'none';
        toggleBtn.style.display = 'block';

        toggleBtn.setAttribute('aria-expanded', 'false');

        toggleBtn.focus();
    }

    async function sendMessage() {
        const messageText = input.value.trim();

        if (!messageText || sendBtn.disabled) {
            return;
        }

        addMessage('user', messageText);

        input.value = '';
        sendBtn.disabled = true;

        const pending = addMessage('bot', 'Думаю…');

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: messageText
                })
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const data = await response.json();

            pending.textContent =
                data.reply || 'Не удалось получить ответ.';

        } catch (error) {
            console.error('Ошибка помощника:', error);

            pending.textContent =
                'Сейчас не получается ответить. Вы можете связаться со мной по телефону +7-953-065-06-79, написать в Telegram или на электронную почту otsifrovka-video@mail.ru.';

        } finally {
            sendBtn.disabled = false;
            messages.scrollTop = messages.scrollHeight;
            input.focus();
        }
    }

    toggleBtn.addEventListener('click', openChat);
    closeBtn.addEventListener('click', closeChat);
    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            sendMessage();
        }
    });

    // Кнопка копирования ссылки на сайт
    const copyButton = document.getElementById('copy-site-link');

    if (copyButton) {
        copyButton.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText('https://otsifrovka-video.ru/')
                    .then(function () {
                        alert('Ссылка скопирована!');
                    })
                    .catch(function () {
                        alert('Не удалось скопировать ссылку.');
                    });
            } else {
                alert('Копирование не поддерживается этим браузером.');
            }
        });
    }

    // Автоматическое открытие помощника через 1 секунду
    setTimeout(openChat, 1000);

})();
</script>
