<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Код подтверждения Яндекса -->
    <meta name="yandex-verification" content="cf595a88aba7e42d" />
    
    <!-- SEO-оптимизация -->
    <title>Оцифровка видеокассет в Новокузнецке</title>
    <meta name="description" content="Качественная оцифровка видеокассет VHS, VHS-C, Hi8, MiniDV, DVD в Новокузнецке. Цена 200 ₽ за час. Бережно сохраним архив.">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* Полная копия шапки Wix */
        .wix-banner {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            height: auto;
            display: block;
        }

        .wix-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Контентная область как на Wix */
        .wix-content {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .sub-text {
            font-size: 18px;
            color: #000000;
            margin-bottom: 25px;
        }

        .price-text {
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
        }

        .detail-text {
            font-size: 16px;
            color: #000000;
            margin-bottom: 50px;
            line-height: 1.4;
        }

        /* Кнопки в оригинальном стиле Wix */
        .wix-buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .wix-btn {
            display: inline-block;
            min-width: 180px;
            padding: 12px 24px;
            border: 1px solid #000000;
            border-radius: 20px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .wix-btn:hover {
            background-color: #f0f0f0;
        }

        /* Исправленная универсальная карта Яндекса */
        .map-section {
            max-width: 480px;
            margin: 0 auto 30px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #cccccc;
        }

        @media (max-width: 768px) {
            .wix-buttons-container {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .wix-btn {
                width: 100%;
                max-width: 280px;
            }
            h1 { font-size: 20px; }
            .sub-text, .price-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Шапка-коллаж с кассетами и молодоженами -->
    <div class="wix-banner">
        <img src="banner.jpg" alt="Оцифровка видеокассет">
    </div>

    <!-- Текстовый блок один в один как на Wix -->
    <div class="wix-content">
        <h1>Оцифровка видеокассет в Новокузнецке</h1>
        
        <p class="sub-text">Сохраню ваши семейные воспоминания в цифровом формате</p>
        
        <p class="price-text">200 ₽ за каждый начатый час записи</p>
        
        <p class="detail-text">Точную стоимость сообщу после просмотра кассет и определения продолжительности записи.</p>

        <!-- Оригинальные овальные кнопки Wix -->
        <div class="wix-buttons-container">
            <a href="https://t.me" target="_blank" class="wix-btn">Написать в Телеграм</a>
            <a href="https://avito.ru" target="_blank" class="wix-btn">Я на Авито</a>
            <a href="https://ok.ru" target="_blank" class="wix-btn">Написать в Одноклассники</a>
        </div>

        <!-- Починенная интерактивная карта -->
        <div class="map-section">
            <iframe src="https://yandex.ru" width="100%" height="240" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Чат-бот Jivo (сообщения идут в Telegram) -->
    <script src="//code.jivo.ru/widget/j6878Y89vU" async></script>

</body>
</html>
